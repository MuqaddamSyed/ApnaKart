name: quickkart
description: Hyperlocal quick-commerce platform for Tier 2/3 towns in India (4 apps, one codebase).
publish_to: 'none'
version: 0.5.1+15

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.4.0
  flutter_map: ^6.0.0          # OpenStreetMap tiles
  latlong2: ^0.9.0
  hive_flutter: ^1.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.0         # tap-to-call
  intl: ^0.18.0               # currency formatting
  shimmer: ^3.0.0             # skeleton loading
  fl_chart: ^0.65.0           # admin charts
  go_router: ^13.0.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

# App launcher icons for all flavors. Generate with:
#   flutter pub run flutter_launcher_icons
# Provide the two source PNGs described in assets/branding/README.md first.
flutter_launcher_icons:
  android: true
  ios: false                                   # flip to true once ios/ project exists
  remove_alpha_ios: true                       # iOS icons must be opaque
  image_path: "assets/branding/icon.png"       # 1024x1024, monogram on solid bg
  adaptive_icon_background: "#FFFFFF"           # Android adaptive background
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/categories/
