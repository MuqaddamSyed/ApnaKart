name: Build APKs

# Always does a clean build (flutter clean) so a stale Dart kernel can never
# ship — the exact failure that produced "new version, old code".
#
# Triggers: push a tag like v0.4.1, or run manually from the Actions tab.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
# Optional (for a real signed release instead of debug-signed):
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: customer
            target: lib/apps/customer/customer_main.dart
          - flavor: supplier
            target: lib/apps/supplier/supplier_main.dart
          - flavor: delivery
            target: lib/apps/delivery/delivery_main.dart
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Write .env
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nFCM_SERVER_KEY=\n' \
            "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_ANON_KEY }}" > .env

      - name: Optional release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          EOF

      - run: flutter pub get
      - run: flutter clean
      - name: Build ${{ matrix.flavor }} APK
        run: flutter build apk --release --flavor ${{ matrix.flavor }} -t ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: apnakart-${{ matrix.flavor }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          if-no-files-found: error
