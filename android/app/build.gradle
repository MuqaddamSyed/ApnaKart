plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle Plugin must be applied after Android & Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase Cloud Messaging. Requires android/app/google-services.json.
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// Optional release signing. If android/key.properties exists (kept out of
// git), release builds are signed with that keystore; otherwise they fall
// back to the debug key so builds always work out of the box.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}

android {
    namespace = "com.quickkart.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Base id; each product flavor overrides applicationId below so the
        // three apps install side-by-side as independent packages.
        applicationId = "com.quickkart"
        minSdkVersion = flutter.minSdkVersion          // Android API 21+ covers ~98% of Tier 2/3 devices
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
        resValue "string", "app_name", "ApnaKart"
    }

    // ---- Product flavors: one installable app each ----
    // Build with a matching entry point, e.g.
    //   flutter run --flavor customer -t lib/apps/customer/customer_main.dart
    flavorDimensions += "app"
    productFlavors {
        customer {
            dimension = "app"
            applicationId = "com.quickkart.customer"
            resValue "string", "app_name", "ApnaKart"
        }
        supplier {
            dimension = "app"
            applicationId = "com.quickkart.supplier"
            resValue "string", "app_name", "ApnaKart Partner"
        }
        delivery {
            dimension = "app"
            applicationId = "com.quickkart.delivery"
            resValue "string", "app_name", "ApnaKart Delivery"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Use the release keystore when android/key.properties is present;
            // otherwise fall back to debug signing so builds run out of the box.
            // (Consistent debug key on this machine still updates in place.)
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    //     implementation platform("com.google.firebase:firebase-bom:32.7.0")
    //     implementation "com.google.firebase:firebase-messaging"
}
